# Gateway local dev (:8081) — mismo patrón que hub agustin-t :80
server {
    listen 80;
    server_name _;

    location = /shift {
        return 301 /shift/;
    }

    # Dev (:8081): sin filtro IP (el cliente llega por bridge Docker, no 127.0.0.1).
    # Producción: filtro 172.17.2.0/24 en docker/nginx/nginx.conf del hub :80.
    location /shift-api/ {
        proxy_pass http://shift-api:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /shift/ {
        proxy_pass http://shift-frontend:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /shift;
    }
}
