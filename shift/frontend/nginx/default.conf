server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Evita redirects absolutos tipo Location: /calendario/ que pierden el prefijo /shift del proxy.
    absolute_redirect off;

    location / {
        # Sin $uri/ — evita 301 a /ruta/ que pierde el prefijo /shift del proxy.
        try_files $uri $uri/index.html @spa_fallback;
    }

    location @spa_fallback {
        # Named location evita ciclo si index.html falta (p. ej. durante generate).
        rewrite ^ /index.html break;
    }

    location = /index.html {
        root /usr/share/nginx/html;
    }
}
