# Desarrollo local Shift (puerto 8081). Producción: servicios en docker/docker-compose.yml + gateway :80.

services:
  shift-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SHIFT_POSTGRES_USER:-shift_user}
      POSTGRES_PASSWORD: ${SHIFT_POSTGRES_PASSWORD:-shift_password}
      POSTGRES_DB: ${SHIFT_POSTGRES_DB:-shift_db}
      TZ: America/Argentina/Buenos_Aires
    volumes:
      - shift_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${SHIFT_POSTGRES_USER:-shift_user} -d ${SHIFT_POSTGRES_DB:-shift_db}']
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [shift]

  shift-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${SHIFT_POSTGRES_USER:-shift_user}:${SHIFT_POSTGRES_PASSWORD:-shift_password}@shift-db:5432/${SHIFT_POSTGRES_DB:-shift_db}
      TZ: America/Argentina/Buenos_Aires
    depends_on:
      shift-db:
        condition: service_healthy
    expose:
      - '3000'
    networks: [shift]

  shift-frontend:
    image: nginx:stable
    restart: unless-stopped
    volumes:
      - ./frontend/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/app/dist:/usr/share/nginx/html:ro
    expose:
      - '80'
    networks: [shift]

  shift-gateway:
    image: nginx:stable
    restart: unless-stopped
    ports:
      - '${SHIFT_DEV_HTTP_PORT:-8081}:80'
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - shift-api
      - shift-frontend
    networks: [shift]

volumes:
  shift_db_data:

networks:
  shift:
    driver: bridge
